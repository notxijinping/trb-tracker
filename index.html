
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TRB/USDT Live Tracker</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      margin: auto;
      border: 2px solid #444;
      border-radius: 12px;
      padding: 2rem;
      background-color: #1e1e1e;
    }
    h1 {
      margin-bottom: 1rem;
      color: #00ffcc;
    }
    .price {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 1rem 0;
    }
    .time {
      font-size: 0.9rem;
      color: #999;
    }
    .chart-container {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TRB/USDT Live Price</h1>
    <div class="price" id="price">$--.--</div>
    <div class="time" id="time">Updating...</div>
    <div class="chart-container">
      <!-- TradingView Chart Widget -->
      <iframe
        src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_12345&symbol=BINANCE:TRBUSDT&interval=60&theme=dark&style=1&timezone=Etc%2FUTC&withdateranges=1&hide_side_toolbar=false&allow_symbol_change=true&save_image=true&studies=[]"
        width="100%" height="400" frameborder="0" allowtransparency="true" scrolling="no">
      </iframe>
    </div>
  </div>

  <script>
    async function fetchPrice() {
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=tellor&vs_currencies=usdt");
        const data = await res.json();
        const price = data.tellor.usdt;
        document.getElementById("price").innerText = "$" + price.toFixed(2);
        document.getElementById("time").innerText = "Updated: " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("price").innerText = "Error";
        console.error("Failed to fetch price:", err);
      }
    }

    fetchPrice();
    setInterval(fetchPrice, 15000);
  </script>
</body>
</html>
